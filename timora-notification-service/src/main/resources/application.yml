spring:
  application:
    name: timora-notification-service
  data:
    rest:
      detection-strategy: annotated
  config:
    import: "optional:configserver:"
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/timora_notification}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_STARTTLS_ENABLE:true}
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

# Configuration SMS Gateway
sms:
  gateway:
    url: ${SMS_GATEWAY_URL:http://localhost:8089}
    api-key: ${SMS_GATEWAY_API_KEY:}
    enabled: ${SMS_GATEWAY_ENABLED:false}

# Configuration Email
notification:
  email:
    from: ${MAIL_FROM:timora.iusjc@gmail.com}

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    appname: TIMORA-NOTIFICATION-SERVICE
    instance-id: ${spring.application.name}:${spring.application.instance-id:${server.port}}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    info:
      enabled: true
  info:
    app:
      name: ${spring.application.name}
      description: Service de gestion des notifications (email, SMS)
      version: 0.0.1-SNAPSHOT

# Documentation OpenAPI / Swagger
springdoc:
  packages-to-scan: com.iusjc.timora.notification.controller
  api-docs:
    path: /v3/api-docs
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    enabled: true
    operationsSorter: method
    tagsSorter: alpha
