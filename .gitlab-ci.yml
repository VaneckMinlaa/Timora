workflow:
  rules:
    - when: always

stages:
  - build
  - test
  - package
  - deploy

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"
  JAVA_VERSION: "21"
  NODE_VERSION: "20"

cache:
  paths:
    - .m2/repository
    - frontend/node_modules

# BUILD STAGE

.build-backend:
  stage: build
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    expire_in: 1 hour

build:config-server:
  extends: .build-backend
  script:
    - cd timora-config-server
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - timora-config-server/target/*.jar

build:eureka-server:
  extends: .build-backend
  script:
    - cd timora-eureka-server
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - timora-eureka-server/target/*.jar

build:gateway:
  extends: .build-backend
  script:
    - cd timora-gateway
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - timora-gateway/target/*.jar

build:auth-service:
  extends: .build-backend
  script:
    - cd timora-auth-service
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - timora-auth-service/target/*.jar

build:user-service:
  extends: .build-backend
  script:
    - cd timora-user-service
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - timora-user-service/target/*.jar

build:room-service:
  extends: .build-backend
  script:
    - cd timora-room-service
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - timora-room-service/target/*.jar

build:reservation-service:
  extends: .build-backend
  script:
    - cd timora-reservation-service
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - timora-reservation-service/target/*.jar

build:schedule-service:
  extends: .build-backend
  script:
    - cd timora-schedule-service
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - timora-schedule-service/target/*.jar

build:notification-service:
  extends: .build-backend
  script:
    - cd timora-notification-service
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - timora-notification-service/target/*.jar

build:reporting-service:
  extends: .build-backend
  script:
    - cd timora-reporting-service
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - timora-reporting-service/target/*.jar

build:integration-service:
  extends: .build-backend
  script:
    - cd timora-integration-service
    - mvn clean compile $MAVEN_CLI_OPTS
  artifacts:
    paths:
      - timora-integration-service/target/*.jar

build:frontend:
  stage: build
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 hour

# TEST STAGE

test:backend:
  stage: test
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn clean test $MAVEN_CLI_OPTS
  artifacts:
    reports:
      junit:
        - "**/target/surefire-reports/TEST-*.xml"
    expire_in: 1 week

test:frontend:e2e:
  stage: test
  image: node:20-alpine
  allow_failure: true
  before_script:
    - apk add --no-cache chromium chromium-chromedriver curl
    - cd frontend
    - npm ci
  script:
    - npm run test:e2e:ci || npm run test:e2e || echo "E2E non disponible"
  artifacts:
    when: always
    paths:
      - frontend/e2e/reports
      - frontend/e2e/screenshots
    expire_in: 1 week

# PACKAGE STAGE

.package-backend:
  stage: package
  image: maven:3.9-eclipse-temurin-21
  script:
    - mvn clean package -DskipTests $MAVEN_CLI_OPTS
  artifacts:
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

package:config-server:
  extends: .package-backend
  script:
    - cd timora-config-server
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - timora-config-server/target/*.jar

package:eureka-server:
  extends: .package-backend
  script:
    - cd timora-eureka-server
    - mvn clean package -DskipTests
  artifacts:
    paths:
      - timora-eureka-server/target/*.jar

package:frontend:
  stage: package
  image: node:20-alpine
  script:
    - cd frontend
    - npm ci
    - npm run build -- --configuration production
  artifacts:
    paths:
      - frontend/dist
    expire_in: 1 day
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'
    - if: '$CI_COMMIT_TAG'

# DEPLOY STAGE

deploy:staging:
  stage: deploy
  image: alpine:latest
  script:
    - echo "Déploiement STAGING"
  environment:
    name: staging
    url: https://staging.timora.example.com
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
      when: manual

deploy:production:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan $VPS_IP >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - ssh $VPS_USER@$VPS_IP "cd ~/Timora && git pull origin main && docker compose up -d --build"
  environment:
    name: production
    url: http://$VPS_IP
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: always
