<div class="forgot-password-container">
  <div class="forgot-password-card">
    <!-- Header -->
    <div class="header">
      <h1 class="title">Mot de passe oublié ?</h1>
      <p class="subtitle">
        Entrez votre adresse email et nous vous enverrons un code de vérification pour réinitialiser votre mot de passe.
      </p>
    </div>

    <!-- Form -->
    <form class="forgot-password-form" [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()">
      <!-- Email Field -->
      <div class="form-group">
        <label for="email" class="form-label">Adresse email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-input"
          placeholder="votre.email@exemple.com"
          [class.has-error]="email?.invalid && email?.touched"
          autocomplete="email"
        />
        <div *ngIf="email?.invalid && email?.touched" class="error-text">
          <span *ngIf="email?.errors?.['required']">L'email est requis</span>
          <span *ngIf="email?.errors?.['email']">Format d'email invalide</span>
        </div>
      </div>

      <!-- Success Message -->
      <div *ngIf="successMessage" class="success-message">
        <span class="material-symbols-outlined">check_circle</span>
        {{ successMessage }}
      </div>

      <!-- Error Message -->
      <div *ngIf="errorMessage" class="error-message">
        <span class="material-symbols-outlined">error</span>
        {{ errorMessage }}
      </div>

      <!-- Submit Button -->
      <button type="submit" class="submit-btn" [disabled]="isLoading">
        <span *ngIf="!isLoading">Envoyer le code</span>
        <span *ngIf="isLoading" class="btn-loader">
          <span class="spinner"></span>
          <span>Envoi en cours...</span>
        </span>
      </button>
    </form>

    <!-- Footer -->
    <div class="footer">
      <p class="footer-text">
        Vous vous souvenez de votre mot de passe ?
        <a routerLink="/login" class="login-link">Se connecter</a>
      </p>
    </div>
  </div>
</div>
