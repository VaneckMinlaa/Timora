name: Timora CI/CD

on:
  push:
    branches: [main, develop]
    tags: ["*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      deploy_staging:
        description: "Déployer sur staging (branche develop)"
        type: boolean
        default: false

env:
  JAVA_VERSION: "21"
  NODE_VERSION: "20"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"
  MAVEN_CLI_OPTS: "--batch-mode --errors --fail-at-end --show-version"

jobs:
  build-backend:
    name: Build ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module:
          - timora-config-server
          - timora-eureka-server
          - timora-gateway
          - timora-auth-service
          - timora-user-service
          - timora-room-service
          - timora-reservation-service
          - timora-schedule-service
          - timora-notification-service
          - timora-reporting-service
          - timora-integration-service
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Compile ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: mvn clean compile ${{ env.MAVEN_CLI_OPTS }}

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.module }}
          path: ${{ matrix.module }}/target/*.jar
          if-no-files-found: ignore
          retention-days: 1

  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install & build
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Upload frontend dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 1

  test-backend:
    name: Test backend
    runs-on: ubuntu-latest
    needs: build-backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Run Maven tests
        run: mvn clean test ${{ env.MAVEN_CLI_OPTS }}

      - name: Publish JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/TEST-*.xml"
          if-no-files-found: ignore
          retention-days: 7

  test-frontend-e2e:
    name: Test frontend E2E
    runs-on: ubuntu-latest
    needs: build-frontend
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y chromium-browser chromium-chromedriver

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run E2E tests
        working-directory: frontend
        run: npm run test:e2e:ci || npm run test:e2e || echo "E2E non disponible"
        env:
          CHROME_BIN: /usr/bin/chromium-browser

      - name: Upload E2E reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-reports
          path: |
            frontend/e2e/reports
            frontend/e2e/screenshots
          if-no-files-found: ignore
          retention-days: 7

  package-backend:
    name: Package ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: [test-backend]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    strategy:
      fail-fast: false
      matrix:
        module:
          - timora-config-server
          - timora-eureka-server
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Package ${{ matrix.module }}
        working-directory: ${{ matrix.module }}
        run: mvn clean package -DskipTests ${{ env.MAVEN_CLI_OPTS }}

      - name: Upload packaged JAR
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.module }}
          path: ${{ matrix.module }}/target/*.jar
          retention-days: 1

  package-frontend:
    name: Package frontend (production)
    runs-on: ubuntu-latest
    needs: [test-frontend-e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Production build
        working-directory: frontend
        run: |
          npm ci
          npm run build -- --configuration production

      - name: Upload production dist
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist-production
          path: frontend/dist
          retention-days: 1

  deploy-staging:
    name: Deploy staging
    runs-on: ubuntu-latest
    needs: [package-backend, package-frontend]
    if: >
      github.ref == 'refs/heads/develop' &&
      (github.event_name == 'workflow_dispatch' && inputs.deploy_staging == true)
    environment:
      name: staging
      url: https://staging.timora.example.com
    steps:
      - name: Staging placeholder
        run: echo "Déploiement STAGING"
