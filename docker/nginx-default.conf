# Configuration serveur Nginx pour Timora Frontend
# Path: /etc/nginx/conf.d/default.conf

server {
  listen 80 default_server;
  listen [::]:80 default_server;

  server_name _;
  charset utf-8;

  # Root directory
  root /usr/share/nginx/html;
  index index.html index.htm;

  # Service Worker
  location = /service-worker.js {
    add_header Cache-Control "max-age=0, no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # SPA routing - redirect to index.html
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "public, max-age=0";
  }

  # API proxy
  location /api/ {
    proxy_pass http://gateway:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection 'upgrade';
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_cache_bypass $http_upgrade;
    proxy_connect_timeout 30s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
  }

  # Eureka proxy (optional, for health checks)
  location /eureka/ {
    proxy_pass http://eureka-server:8761/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Actuator endpoints (optional, for monitoring)
  location /actuator/ {
    proxy_pass http://gateway:8080/actuator/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Assets caching - long term
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    access_log off;
  }

  # Manifest and config files
  location ~* \.(json|xml|txt|webmanifest)$ {
    expires 1d;
    add_header Cache-Control "public, max-age=86400";
  }

  # Health check
  location /health {
    access_log off;
    return 200 "healthy\n";
    add_header Content-Type text/plain;
  }

  # Deny access to sensitive files
  location ~ /\. {
    deny all;
    access_log off;
    log_not_found off;
  }

  location ~ ~$ {
    deny all;
    access_log off;
    log_not_found off;
  }

  # Error pages
  error_page 404 /index.html;
  error_page 500 502 503 504 /50x.html;
  location = /50x.html {
    root /usr/share/nginx/html;
  }
}
