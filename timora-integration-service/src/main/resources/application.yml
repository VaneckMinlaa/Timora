spring:
  application:
    name: timora-integration-service
  config:
    import: "optional:configserver:"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true
    appname: TIMORA-INTEGRATION-SERVICE
    instance-id: ${spring.application.name}:${spring.application.instance-id:${server.port}}

server:
  port: 8088

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    info:
      enabled: true
  info:
    app:
      name: ${spring.application.name}
      description: Service d'intégration avec les systèmes externes
      version: 0.0.1-SNAPSHOT
